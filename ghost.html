<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ghost Runner - Pixel Ghost</title>
  <style>
    body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; gap: 40px; }
    .label { color: #666; font-family: monospace; font-size: 12px; }
    .ghost-container { position: relative; }

    /* Body: very subtle bob, barely noticeable */
    .ghost-body {
      animation: bob 0.3s steps(1) infinite;
    }
    @keyframes bob {
      0% { transform: translateY(0); }
      50% { transform: translateY(-0.5px); }
    }

    /* Left foot: full running stride */
    .foot-left {
      animation: runLeft 0.3s steps(1) infinite;
      transform-origin: 7px 20px;
    }
    @keyframes runLeft {
      0%   { transform: translate(-2px, 0); }   /* back */
      25%  { transform: translate(0, -1px); }    /* up */
      50%  { transform: translate(2px, 0); }     /* forward */
      75%  { transform: translate(0, 0); }       /* down */
    }

    /* Right foot: opposite phase */
    .foot-right {
      animation: runRight 0.3s steps(1) infinite;
      transform-origin: 17px 20px;
    }
    @keyframes runRight {
      0%   { transform: translate(2px, 0); }     /* forward */
      25%  { transform: translate(0, 0); }       /* down */
      50%  { transform: translate(-2px, 0); }    /* back */
      75%  { transform: translate(0, -1px); }    /* up */
    }

    /* Speed lines pulse */
    .speed-lines {
      animation: pulse 0.15s steps(1) infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.8; transform: translateX(0); }
      50% { opacity: 0.3; transform: translateX(-0.5px); }
    }
  </style>
</head>
<body>

<div class="label">24x24 actual size</div>
<svg width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Ghost body -->
  <g fill="#4EC44E">
    <!-- Head dome -->
    <rect x="6" y="1" width="12" height="1"/>
    <rect x="4" y="2" width="16" height="1"/>
    <rect x="3" y="3" width="18" height="1"/>
    <rect x="2" y="4" width="20" height="2"/>
    <!-- Eyes row -->
    <rect x="2" y="6" width="5" height="2"/>
    <rect x="11" y="6" width="3" height="2"/>
    <rect x="18" y="6" width="4" height="2"/>
    <!-- Nose bridge -->
    <rect x="2" y="8" width="5" height="3"/>
    <rect x="9" y="8" width="5" height="3"/>
    <rect x="16" y="8" width="6" height="3"/>
    <!-- Full body -->
    <rect x="2" y="11" width="20" height="4"/>
    <rect x="1" y="15" width="22" height="2"/>
    <!-- Wavy bottom -->
    <rect x="1" y="17" width="9" height="1"/>
    <rect x="11" y="17" width="3" height="1"/>
    <rect x="15" y="17" width="8" height="1"/>
    <!-- Left leg -->
    <rect x="1" y="18" width="3" height="1"/>
    <rect x="5" y="18" width="4" height="2"/>
    <rect x="6" y="20" width="2" height="1"/>
    <rect x="6" y="21" width="6" height="2"/>
    <!-- Right leg -->
    <rect x="15" y="18" width="4" height="2"/>
    <rect x="20" y="18" width="3" height="1"/>
    <rect x="16" y="20" width="2" height="1"/>
    <rect x="16" y="21" width="6" height="2"/>
  </g>
</svg>

<div class="label">animated (scaled 8x)</div>
<svg width="192" height="192" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <g class="ghost-body" fill="#4EC44E">
    <!-- Head dome -->
    <rect x="6" y="1" width="12" height="1"/>
    <rect x="4" y="2" width="16" height="1"/>
    <rect x="3" y="3" width="18" height="1"/>
    <rect x="2" y="4" width="20" height="2"/>
    <!-- Eyes -->
    <rect x="2" y="6" width="5" height="2"/>
    <rect x="11" y="6" width="3" height="2"/>
    <rect x="18" y="6" width="4" height="2"/>
    <!-- Nose bridge -->
    <rect x="2" y="8" width="5" height="3"/>
    <rect x="9" y="8" width="5" height="3"/>
    <rect x="16" y="8" width="6" height="3"/>
    <!-- Full body -->
    <rect x="2" y="11" width="20" height="4"/>
    <rect x="1" y="15" width="22" height="2"/>
    <!-- Wavy bottom -->
    <rect x="1" y="17" width="9" height="1"/>
    <rect x="11" y="17" width="3" height="1"/>
    <rect x="15" y="17" width="8" height="1"/>
  </g>
  <!-- Left foot -->
  <g class="foot-left" fill="#4EC44E">
    <rect x="1" y="18" width="3" height="1"/>
    <rect x="5" y="18" width="4" height="2"/>
    <rect x="6" y="20" width="2" height="1"/>
    <rect x="6" y="21" width="6" height="2"/>
  </g>
  <!-- Right foot -->
  <g class="foot-right" fill="#4EC44E">
    <rect x="15" y="18" width="4" height="2"/>
    <rect x="20" y="18" width="3" height="1"/>
    <rect x="16" y="20" width="2" height="1"/>
    <rect x="16" y="21" width="6" height="2"/>
  </g>
  <!-- Speed lines -->
  <g class="speed-lines" fill="#4EC44E" opacity="0.6">
    <rect x="0" y="7" width="1" height="1"/>
    <rect x="0" y="10" width="1" height="1"/>
    <rect x="0" y="13" width="1" height="1"/>
  </g>
</svg>

<div class="label">run cycle — 6 sprite frames (scaled 8x)</div>
<div class="sprite-runner">
  <!-- F1: CONTACT — right foot lands ahead, left behind, body low -->
  <svg class="run-frame rf1" width="192" height="192" viewBox="0 0 24 24" shape-rendering="crispEdges"><g fill="#4EC44E">
    <rect x="6" y="2" width="12" height="1"/><rect x="4" y="3" width="16" height="1"/>
    <rect x="3" y="4" width="18" height="1"/><rect x="2" y="5" width="20" height="2"/>
    <rect x="2" y="7" width="5" height="2"/><rect x="11" y="7" width="3" height="2"/><rect x="18" y="7" width="4" height="2"/>
    <rect x="2" y="9" width="5" height="3"/><rect x="9" y="9" width="5" height="3"/><rect x="16" y="9" width="6" height="3"/>
    <rect x="2" y="12" width="20" height="3"/><rect x="1" y="15" width="22" height="2"/>
    <rect x="1" y="17" width="9" height="1"/><rect x="11" y="17" width="3" height="1"/><rect x="15" y="17" width="8" height="1"/>
    <!-- R leg: stretched forward, foot flat -->
    <rect x="17" y="18" width="2" height="1"/>
    <rect x="19" y="19" width="2" height="1"/>
    <rect x="20" y="20" width="3" height="1"/>
    <!-- L leg: trailing behind, foot up -->
    <rect x="5" y="18" width="2" height="1"/>
    <rect x="3" y="18" width="2" height="1"/>
    <rect x="2" y="17" width="2" height="1"/>
  </g></svg>

  <!-- F2: PUSH — right leg pushes off straight, left knee drives forward+up -->
  <svg class="run-frame rf2" width="192" height="192" viewBox="0 0 24 24" shape-rendering="crispEdges"><g fill="#4EC44E">
    <rect x="6" y="1" width="12" height="1"/><rect x="4" y="2" width="16" height="1"/>
    <rect x="3" y="3" width="18" height="1"/><rect x="2" y="4" width="20" height="2"/>
    <rect x="2" y="6" width="5" height="2"/><rect x="11" y="6" width="3" height="2"/><rect x="18" y="6" width="4" height="2"/>
    <rect x="2" y="8" width="5" height="3"/><rect x="9" y="8" width="5" height="3"/><rect x="16" y="8" width="6" height="3"/>
    <rect x="2" y="11" width="20" height="4"/><rect x="1" y="15" width="22" height="2"/>
    <rect x="1" y="17" width="9" height="1"/><rect x="11" y="17" width="3" height="1"/><rect x="15" y="17" width="8" height="1"/>
    <!-- R leg: straight down, pushing -->
    <rect x="15" y="18" width="2" height="1"/>
    <rect x="15" y="19" width="2" height="1"/>
    <rect x="14" y="20" width="3" height="1"/>
    <!-- L leg: knee up, foot tucked back -->
    <rect x="5" y="18" width="2" height="1"/>
    <rect x="4" y="17" width="3" height="1"/>
    <rect x="3" y="16" width="2" height="1"/>
  </g></svg>

  <!-- F3: FLIGHT — both feet off ground, body highest -->
  <svg class="run-frame rf3" width="192" height="192" viewBox="0 0 24 24" shape-rendering="crispEdges"><g fill="#4EC44E">
    <rect x="6" y="0" width="12" height="1"/><rect x="4" y="1" width="16" height="1"/>
    <rect x="3" y="2" width="18" height="1"/><rect x="2" y="3" width="20" height="2"/>
    <rect x="2" y="5" width="5" height="2"/><rect x="11" y="5" width="3" height="2"/><rect x="18" y="5" width="4" height="2"/>
    <rect x="2" y="7" width="5" height="3"/><rect x="9" y="7" width="5" height="3"/><rect x="16" y="7" width="6" height="3"/>
    <rect x="2" y="10" width="20" height="4"/><rect x="1" y="14" width="22" height="2"/>
    <rect x="1" y="16" width="9" height="1"/><rect x="11" y="16" width="3" height="1"/><rect x="15" y="16" width="8" height="1"/>
    <!-- R leg: folding back behind -->
    <rect x="16" y="17" width="2" height="1"/>
    <rect x="18" y="17" width="2" height="1"/>
    <rect x="19" y="16" width="2" height="1"/>
    <!-- L leg: reaching forward -->
    <rect x="5" y="17" width="2" height="1"/>
    <rect x="3" y="17" width="2" height="1"/>
    <rect x="1" y="18" width="3" height="1"/>
  </g></svg>

  <!-- F4: CONTACT mirror — left foot lands, right behind, body low -->
  <svg class="run-frame rf4" width="192" height="192" viewBox="0 0 24 24" shape-rendering="crispEdges"><g fill="#4EC44E">
    <rect x="6" y="2" width="12" height="1"/><rect x="4" y="3" width="16" height="1"/>
    <rect x="3" y="4" width="18" height="1"/><rect x="2" y="5" width="20" height="2"/>
    <rect x="2" y="7" width="5" height="2"/><rect x="11" y="7" width="3" height="2"/><rect x="18" y="7" width="4" height="2"/>
    <rect x="2" y="9" width="5" height="3"/><rect x="9" y="9" width="5" height="3"/><rect x="16" y="9" width="6" height="3"/>
    <rect x="2" y="12" width="20" height="3"/><rect x="1" y="15" width="22" height="2"/>
    <rect x="1" y="17" width="9" height="1"/><rect x="11" y="17" width="3" height="1"/><rect x="15" y="17" width="8" height="1"/>
    <!-- L leg: forward flat -->
    <rect x="5" y="18" width="2" height="1"/>
    <rect x="3" y="19" width="2" height="1"/>
    <rect x="1" y="20" width="3" height="1"/>
    <!-- R leg: trailing, foot up -->
    <rect x="17" y="18" width="2" height="1"/>
    <rect x="19" y="18" width="2" height="1"/>
    <rect x="20" y="17" width="2" height="1"/>
  </g></svg>

  <!-- F5: PUSH mirror — left pushes, right knee drives up -->
  <svg class="run-frame rf5" width="192" height="192" viewBox="0 0 24 24" shape-rendering="crispEdges"><g fill="#4EC44E">
    <rect x="6" y="1" width="12" height="1"/><rect x="4" y="2" width="16" height="1"/>
    <rect x="3" y="3" width="18" height="1"/><rect x="2" y="4" width="20" height="2"/>
    <rect x="2" y="6" width="5" height="2"/><rect x="11" y="6" width="3" height="2"/><rect x="18" y="6" width="4" height="2"/>
    <rect x="2" y="8" width="5" height="3"/><rect x="9" y="8" width="5" height="3"/><rect x="16" y="8" width="6" height="3"/>
    <rect x="2" y="11" width="20" height="4"/><rect x="1" y="15" width="22" height="2"/>
    <rect x="1" y="17" width="9" height="1"/><rect x="11" y="17" width="3" height="1"/><rect x="15" y="17" width="8" height="1"/>
    <!-- L leg: straight push -->
    <rect x="7" y="18" width="2" height="1"/>
    <rect x="7" y="19" width="2" height="1"/>
    <rect x="6" y="20" width="3" height="1"/>
    <!-- R leg: knee up, foot tucked -->
    <rect x="17" y="18" width="2" height="1"/>
    <rect x="18" y="17" width="3" height="1"/>
    <rect x="20" y="16" width="2" height="1"/>
  </g></svg>

  <!-- F6: FLIGHT mirror — airborne, legs switching -->
  <svg class="run-frame rf6" width="192" height="192" viewBox="0 0 24 24" shape-rendering="crispEdges"><g fill="#4EC44E">
    <rect x="6" y="0" width="12" height="1"/><rect x="4" y="1" width="16" height="1"/>
    <rect x="3" y="2" width="18" height="1"/><rect x="2" y="3" width="20" height="2"/>
    <rect x="2" y="5" width="5" height="2"/><rect x="11" y="5" width="3" height="2"/><rect x="18" y="5" width="4" height="2"/>
    <rect x="2" y="7" width="5" height="3"/><rect x="9" y="7" width="5" height="3"/><rect x="16" y="7" width="6" height="3"/>
    <rect x="2" y="10" width="20" height="4"/><rect x="1" y="14" width="22" height="2"/>
    <rect x="1" y="16" width="9" height="1"/><rect x="11" y="16" width="3" height="1"/><rect x="15" y="16" width="8" height="1"/>
    <!-- L leg: folding back -->
    <rect x="6" y="17" width="2" height="1"/>
    <rect x="4" y="17" width="2" height="1"/>
    <rect x="3" y="16" width="2" height="1"/>
    <!-- R leg: reaching forward -->
    <rect x="17" y="17" width="2" height="1"/>
    <rect x="19" y="17" width="2" height="1"/>
    <rect x="21" y="18" width="3" height="1"/>
  </g></svg>
</div>

<style>
  .sprite-runner {
    position: relative;
    width: 192px;
    height: 192px;
  }
  .run-frame {
    position: absolute;
    top: 0; left: 0;
    opacity: 0;
  }
  /* 6 frames at 100ms each = 600ms full cycle */
  .rf1 { animation: show6 0.6s steps(1) infinite; animation-delay: 0s; }
  .rf2 { animation: show6 0.6s steps(1) infinite; animation-delay: 0.1s; }
  .rf3 { animation: show6 0.6s steps(1) infinite; animation-delay: 0.2s; }
  .rf4 { animation: show6 0.6s steps(1) infinite; animation-delay: 0.3s; }
  .rf5 { animation: show6 0.6s steps(1) infinite; animation-delay: 0.4s; }
  .rf6 { animation: show6 0.6s steps(1) infinite; animation-delay: 0.5s; }
  @keyframes show6 {
    0%      { opacity: 1; }
    16.67%  { opacity: 0; }
  }
</style>

<div class="label">static SVG (white, for dark bg)</div>
<svg width="192" height="192" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <g fill="white">
    <rect x="6" y="1" width="12" height="1"/>
    <rect x="4" y="2" width="16" height="1"/>
    <rect x="3" y="3" width="18" height="1"/>
    <rect x="2" y="4" width="20" height="2"/>
    <rect x="2" y="6" width="5" height="2"/>
    <rect x="11" y="6" width="3" height="2"/>
    <rect x="18" y="6" width="4" height="2"/>
    <rect x="2" y="8" width="5" height="3"/>
    <rect x="9" y="8" width="5" height="3"/>
    <rect x="16" y="8" width="6" height="3"/>
    <rect x="2" y="11" width="20" height="4"/>
    <rect x="1" y="15" width="22" height="2"/>
    <rect x="1" y="17" width="9" height="1"/>
    <rect x="11" y="17" width="3" height="1"/>
    <rect x="15" y="17" width="8" height="1"/>
    <rect x="1" y="18" width="3" height="1"/>
    <rect x="5" y="18" width="4" height="2"/>
    <rect x="6" y="20" width="2" height="1"/>
    <rect x="6" y="21" width="6" height="2"/>
    <rect x="15" y="18" width="4" height="2"/>
    <rect x="20" y="18" width="3" height="1"/>
    <rect x="16" y="20" width="2" height="1"/>
    <rect x="16" y="21" width="6" height="2"/>
  </g>
</svg>

</body>
</html>
